<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>google-link fixture</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Render-blocking, but display=swap is set: only render-blocking-google-css -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Bebas+Neue&display=swap">
  <!-- Icon font with display=block, loaded with the print-media swap: no finding -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"></noscript>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1 class="title">Bebas headline</h1>
  <p class="tagline">Bebas tagline in italic</p>
  <p>Body text in Inter, <strong>bold</strong>.</p>
  <span class="material-symbols-outlined">home</span>
</body>
</html>
